<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Kern</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<header class="header">
    <div class="header__brand">
        <span class="header__logo" aria-hidden="true">◈</span>
        <h1 class="header__title">Kern</h1>
    </div>
    <div class="header__meta">
        <span class="header__host" id="hostname" th:text="${data.host.hostname}">hostname</span>
        <span class="header__updated" id="last-updated">Обновлено: —</span>
    </div>
</header>

<main class="main">
    <section class="status-card" id="health-card" th:classappend="'status-card--' + ${data.health.level}">
        <div class="status-card__indicator" id="health-indicator"></div>
        <div class="status-card__content">
            <h2 class="status-card__title" id="health-message" th:text="${data.health.message}">Status</h2>
            <ul class="status-card__checks" id="health-checks">
                <li th:each="check : ${data.health.checks}"
                    th:class="'check check--' + ${check.level}"
                    th:text="${check.name} + ': ' + ${check.message}">CPU: 0%</li>
            </ul>
        </div>
        <div class="status-card__uptime">
            <span class="label">Uptime</span>
            <span class="value" id="uptime" th:text="${data.uptimeFormatted}">0m</span>
        </div>
    </section>

    <section class="grid grid--metrics">
        <article class="metric-card">
            <header class="metric-card__header">
                <h3>CPU</h3>
                <span class="metric-card__value" id="cpu-value" th:text="${data.cpu.percent} + '%'">0%</span>
            </header>
            <div class="progress">
                <div class="progress__bar progress__bar--cpu" id="cpu-bar"
                     th:style="'width:' + ${data.cpu.percent} + '%'"></div>
            </div>
            <p class="metric-card__hint" th:text="${data.host.processorCount} + ' ядер'">—</p>
        </article>

        <article class="metric-card">
            <header class="metric-card__header">
                <h3>Память</h3>
                <span class="metric-card__value" id="memory-value" th:text="${data.memory.percent} + '%'">0%</span>
            </header>
            <div class="progress">
                <div class="progress__bar progress__bar--memory" id="memory-bar"
                     th:style="'width:' + ${data.memory.percent} + '%'"></div>
            </div>
            <p class="metric-card__hint" id="memory-hint"
               th:text="${data.memory.usedFormatted} + ' / ' + ${data.memory.totalFormatted}">—</p>
        </article>

        <article class="metric-card metric-card--wide" id="load-card"
                 th:classappend="${data.loadAverage == null} ? 'metric-card--hidden' : ''">
            <header class="metric-card__header">
                <h3>Load Average</h3>
            </header>
            <div class="load-grid" id="load-grid">
                <div class="load-item" th:if="${data.loadAverage != null}">
                    <span class="load-item__label">1 min</span>
                    <span class="load-item__value" id="load-1" th:text="${data.loadAverage.one}">—</span>
                </div>
                <div class="load-item" th:if="${data.loadAverage != null}">
                    <span class="load-item__label">5 min</span>
                    <span class="load-item__value" id="load-5" th:text="${data.loadAverage.five}">—</span>
                </div>
                <div class="load-item" th:if="${data.loadAverage != null}">
                    <span class="load-item__label">15 min</span>
                    <span class="load-item__value" id="load-15" th:text="${data.loadAverage.fifteen}">—</span>
                </div>
            </div>
        </article>
    </section>

    <section class="section">
        <h2 class="section__title">Диски</h2>
        <div class="disk-list" id="disk-list">
            <article class="disk-card" th:each="disk : ${data.disks}">
                <div class="disk-card__header">
                    <span class="disk-card__name" th:text="${disk.name}">disk</span>
                    <span class="disk-card__mount" th:text="${disk.mount}">/</span>
                    <span class="disk-card__percent" th:text="${disk.percent} + '%'">0%</span>
                </div>
                <div class="progress progress--sm">
                    <div class="progress__bar progress__bar--disk"
                         th:style="'width:' + ${disk.percent} + '%'"></div>
                </div>
                <p class="disk-card__hint" th:text="${disk.usedFormatted} + ' / ' + ${disk.totalFormatted}">—</p>
            </article>
        </div>
    </section>

    <section class="section section--info">
        <h2 class="section__title">Система</h2>
        <dl class="info-list">
            <div class="info-list__row">
                <dt>ОС</dt>
                <dd id="info-os" th:text="${data.host.os}">—</dd>
            </div>
            <div class="info-list__row">
                <dt>Архитектура</dt>
                <dd id="info-arch" th:text="${data.host.arch}">—</dd>
            </div>
        </dl>
    </section>
</main>

<footer class="footer">
    <span>Kern v0.1</span>
    <span class="footer__dot">·</span>
    <span>порт 8090</span>
</footer>

<script th:inline="javascript">
    window.KERN = {
        refreshIntervalMs: /*[[${refreshIntervalMs}]]*/ 5000
    };
</script>
<script th:src="@{/js/dashboard.js}"></script>
</body>
</html>
