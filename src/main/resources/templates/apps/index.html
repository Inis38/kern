<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Приложения')}"></head>
<body>
<header th:replace="~{fragments/layout :: page-header('apps')}"></header>

<main class="main">
    <div th:replace="~{fragments/layout :: flash-messages}"></div>

    <section class="section">
        <h2 class="section__title">Приложения</h2>
        <p class="section__lead">Установка и настройка серверного ПО</p>

        <div class="disk-list">
            <article class="disk-card" th:each="app : ${apps}">
                <div class="disk-card__header">
                    <span class="disk-card__name" th:text="${app.displayName}">App</span>
                    <span class="disk-card__mount" th:text="${app.description}">—</span>
                    <span class="tag"
                          th:classappend="${app.status.installState.name() == 'INSTALLED'} ? ' tag--ok' : ' tag--muted'"
                          th:text="${app.status.installState.name() == 'INSTALLED'} ? 'Установлен' : 'Не установлен'">—</span>
                </div>
                <p class="disk-card__hint" th:if="${app.status.version != null}"
                   th:text="'Версия ' + ${app.status.version}">—</p>
                <p class="disk-card__hint" th:if="${app.status.detail}" th:text="${app.status.detail}">—</p>
                <a th:href="@{/apps/{slug}(slug=${app.slug})}" class="card-action">Настроить →</a>
            </article>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
