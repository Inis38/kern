<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Файлы')}"></head>
<body>
<header th:replace="~{fragments/layout :: page-header('files')}"></header>

<main class="main main--loading" id="files-main">
    <section class="section section--files">
        <div class="files-toolbar">
            <div>
                <h2 class="section__title files-toolbar__title">Файлы на сервере</h2>
                <p class="section__lead">Навигация, просмотр, загрузка и удаление в разрешённых каталогах</p>
            </div>
            <div class="files-toolbar__actions">
                <button type="button" class="text-action" id="files-upload-btn">Загрузить</button>
                <button type="button" class="text-action text-action--danger" id="files-delete-btn" disabled>Удалить выбранные</button>
                <button type="button" class="text-action" id="files-refresh-btn">Обновить</button>
            </div>
        </div>

        <nav class="files-breadcrumb" id="files-breadcrumb" aria-label="Текущий каталог"></nav>

        <div class="notice notice--error" id="files-error" hidden></div>
        <div class="notice notice--success" id="files-success" hidden></div>

        <div class="files-table-wrap">
            <table class="files-table" id="files-table">
                <thead>
                <tr>
                    <th class="files-table__check"><input type="checkbox" id="files-select-all" title="Выбрать все"/></th>
                    <th>Имя</th>
                    <th>Тип</th>
                    <th>Размер</th>
                    <th>Изменён</th>
                    <th></th>
                </tr>
                </thead>
                <tbody id="files-table-body">
                <tr><td colspan="6" class="files-table__empty">Загрузка…</td></tr>
                </tbody>
            </table>
        </div>
    </section>

    <section class="section files-preview" id="files-preview" hidden>
        <div class="files-preview__header">
            <h3 class="section__title" id="files-preview-title">Просмотр файла</h3>
            <button type="button" class="text-action" id="files-preview-close">Закрыть</button>
        </div>
        <p class="section__lead" id="files-preview-meta"></p>
        <pre class="files-preview__content" id="files-preview-content"></pre>
    </section>
</main>

<input type="file" id="files-upload-input" multiple hidden/>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<script th:inline="javascript">
    window.KERN_FILES = {
        apiBase: /*[[@{/api/v1/files}]]*/ '/api/v1/files',
        defaultPath: /*[[${data.defaultPath}]]*/ '/',
        fetchTimeoutMs: 30000
    };
</script>
<script th:src="@{/js/files.js}"></script>
</body>
</html>
