server:
  port: 8090

spring:
  application:
    name: kern
  thymeleaf:
    cache: false
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

kern:
  monitoring:
    refresh-interval-ms: 5000
    cpu-sample-delay-ms: 500
  files:
    allowed-roots:
      - /
    max-content-bytes: 524288
    max-upload-bytes: 104857600
  security:
    command-timeout-seconds: 8
    auth-log-timeout-seconds: 12
    auth-log-tail-lines: 3000
  apps:
    command-timeout-seconds: 300
    nginx:
      site-config-path: /etc/nginx/sites-available/kern-managed
      enabled-link-path: /etc/nginx/sites-enabled/kern-managed
      settings-path: /var/lib/kern/apps/nginx/settings.properties
    ufw:
      default-config-path: /etc/default/ufw
      ufw-config-path: /etc/ufw/ufw.conf

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.kern: INFO
    root: INFO
  file:
    name: kern.log
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} : %msg%n"
  logback:
    rollingpolicy:
      file-name-pattern: kern.log.%d{yyyy-MM-dd}.%i.gz
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 500MB
